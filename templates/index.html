<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentiment Analysis</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 34px;
            margin-bottom: 10px;
            color: #222;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .input-section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            max-height: 450px;
            padding: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            resize: vertical;
            font-size: 16px;
            line-height: 1.6;
            font-family: Arial, sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #555;
        }

        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .counter {
            color: #777;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 22px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .analyze-btn {
            background: #222;
            color: white;
        }

        .clear-btn {
            background: #e9e9e9;
            color: #333;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            background: #f7f7f7;
            border: 1px solid #ddd;
        }

        .result h2 {
            margin-bottom: 20px;
            color: #222;
        }

        .sentiment {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .positive {
            color: #16803c;
        }

        .negative {
            color: #c62828;
        }

        .neutral {
            color: #555;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .metric {
            background: white;
            padding: 18px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .metric-title {
            color: #777;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .metric-value {
            font-size: 20px;
            font-weight: bold;
            color: #222;
        }

        .hint {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 25px;
            }

            .header h1 {
                font-size: 27px;
            }

            .metrics {
                grid-template-columns: 1fr;
            }

            .bottom-row {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }

            .buttons {
                width: 100%;
            }

            button {
                flex: 1;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <div class="header">

                <h1>Sentiment Analysis</h1>

                <p>
                    Enter any text and analyze its sentiment using TextBlob.
                </p>

            </div>


            <form method="POST">

                <div class="input-section">

                    <label for="text">Enter your text</label>

                    <textarea
                        id="text"
                        name="text"
                        placeholder="Write a sentence, paragraph, review, feedback, or any other text..."
                        required>{{ text }}</textarea>

                    <div class="bottom-row">

                        <span class="counter">
                            Characters: <span id="count">0</span>
                        </span>

                        <div class="buttons">

                            <button
                                type="button"
                                class="clear-btn"
                                onclick="clearText()">
                                Clear
                            </button>

                            <button
                                type="submit"
                                class="analyze-btn">
                                Analyze Sentiment
                            </button>

                        </div>

                    </div>

                </div>

            </form>


            {% if sentiment %}

            <div class="result">

                <h2>Analysis Result</h2>

                <div class="sentiment
                    {% if sentiment == 'Positive' %}
                        positive
                    {% elif sentiment == 'Negative' %}
                        negative
                    {% else %}
                        neutral
                    {% endif %}">

                    {{ sentiment }}

                </div>


                <div class="metrics">

                    <div class="metric">

                        <div class="metric-title">
                            Polarity
                        </div>

                        <div class="metric-value">
                            {{ polarity }}
                        </div>

                    </div>


                    <div class="metric">

                        <div class="metric-title">
                            Subjectivity
                        </div>

                        <div class="metric-value">
                            {{ subjectivity }}
                        </div>

                    </div>

                </div>

            </div>

            {% endif %}


            <div class="hint">
                Enter text naturally — sentences or longer paragraphs are supported.
            </div>

        </div>

    </div>


    <script>

        const textArea = document.getElementById("text");
        const count = document.getElementById("count");


        function updateCount() {

            count.textContent = textArea.value.length;

        }


        function clearText() {

            textArea.value = "";
            updateCount();
            textArea.focus();

        }


        textArea.addEventListener("input", updateCount);


        updateCount();

    </script>

</body>

</html>
